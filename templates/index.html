<!DOCTYPE html>
<html lang="en">
<head>
    <title>Chessmate AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>
<body>
    <div class="main-container">
        <div id="board-side">
            <h2 style="color: white; text-align: center; margin-top: 0; font-family: sans-serif;">Chessmate AI</h2>
            
            <div class="board-eval-wrapper" style="position: relative;">
                <div id="eval-bar-container">
                    <div id="eval-bar"></div>
                </div>
                <div id="myBoard"></div>

                <div id="game-over-overlay">
                    <h2 id="end-title">Checkmate!</h2>
                    <p id="end-subtitle">White Wins</p>
                    <div style="display: flex; gap: 10px; margin-top: 15px;">
                        <button class="action-btn primary" onclick="requestGameSummary()">Game Summary</button>
                        <button class="action-btn danger" onclick="resetGame()">Play Again</button>
                    </div>
                </div>
                
                <div id="promotion-overlay">
                    <div class="promotion-menu">
                        <div class="promo-piece" onclick="choosePromotion('q')">♕</div>
                        <div class="promo-piece" onclick="choosePromotion('r')">♖</div>
                        <div class="promo-piece" onclick="choosePromotion('b')">♗</div>
                        <div class="promo-piece" onclick="choosePromotion('n')">♘</div>
                    </div>
                </div>

                </div>
            
            <div class="board-actions">
                <button class="action-btn primary" id="explain-btn">Explain Move</button>
                <button class="action-btn secondary" id="suggest-btn">Best Move?</button>
                <button class="action-btn danger" onclick="resetGame()">Reset Game</button>
            </div>
        </div>

        <div id="sidebar">
            <div class="mode-toggle">
                <button class="mode-btn active" onclick="setMode('analysis', this)">Analysis</button>
                <button class="mode-btn" onclick="setMode('play', this)">Play AI</button>
            </div>

            <div id="elo-panel" style="display: none;">
                <p style="color: #64748b; font-size: 0.8rem; margin-bottom: 8px; font-weight: bold;">SELECT DIFFICULTY:</p>
                <div class="elo-grid">
                    <button class="elo-btn active" onclick="setElo(200, this)">200</button>
                    <button class="elo-btn" onclick="setElo(400, this)">400</button>
                    <button class="elo-btn" onclick="setElo(800, this)">800</button>
                    <button class="elo-btn" onclick="setElo(1200, this)">1200</button>
                    <button class="elo-btn" onclick="setElo(1600, this)">1600</button>
                    <button class="elo-btn" onclick="setElo(2000, this)">2000</button>
                    <button class="elo-btn" onclick="setElo(2400, this)">2400</button>
                    <button class="elo-btn" onclick="setElo(2800, this)">2800+</button>
                </div>
            </div>

            <div class="move-history-wrapper">
                <div class="move-history-header">📜 Move History</div>
                <div id="move-list" class="move-grid">
                    </div>
            </div>
            <div class="chat-wrapper">
                <div class="chat-header">🤖 AI Coach Chat</div>
                <div id="chat-history">
                    <div class="msg bot">Hello! Ready to analyze?</div>
                </div>
                <div class="chat-input-area">
                    <input type="text" placeholder="Ask coach anything...">
                    <button class="send-btn">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        var board = null;
        var game = new Chess();
        var currentGameMode = 'analysis'; 
        let currentElo = 400;

        // 1. Initialize the board configuration
        var config = {
            draggable: true,      // Allows you to drag pieces
            position: 'start',    // Sets the board to the starting position
            onDrop: onDrop,       // Links to your existing move logic
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' 
            // ^ This uses the default online images so you don't have to worry about local paths yet
        };

        board = Chessboard('myBoard', config);

        function setMode(mode, element) {
            currentGameMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');

            const evalContainer = document.getElementById('eval-bar-container');
            const eloPanel = document.getElementById('elo-panel');

            if (mode === 'play') {
                evalContainer.style.display = 'none'; 
                eloPanel.style.display = 'block';    
            } else {
                evalContainer.style.display = 'block'; 
                eloPanel.style.display = 'none';
            }
        }

        function setElo(elo, element) {
            currentElo = elo; 
            document.querySelectorAll('.elo-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }

        function requestGameSummary() {
            // 1. Hide the overlay so the user can see the chat
            $('#game-over-overlay').hide();
            
            // 2. Add the user prompt to the chat
            appendChatMessage("user", "Can you give me a summary of that game?");
            
            // 3. Show the loading state
            const chatHistory = document.getElementById('chat-history');
            const loadingDiv = document.createElement('div');
            loadingDiv.id = "coach-loading"; 
            loadingDiv.className = "msg bot";
            loadingDiv.innerHTML = "<em>Analyzing the full game PGN...</em>";
            chatHistory.appendChild(loadingDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;

            // 4. Fetch the full PGN and send it to the new backend route
            const gamePgn = game.pgn();

            fetch("/game_summary", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    pgn: gamePgn,
                    bot_elo: currentElo // Passing the Elo gives the Coach context on the difficulty
                })
            })
            .then(res => res.json())
            .then(data => {
                const loader = document.getElementById('coach-loading');
                if (loader) loader.remove();

                if (data.status === "success") {
                    appendChatMessage("bot", data.summary, true); // True triggers your typewriter effect
                } else {
                    appendChatMessage("bot", "Oops: " + data.message, true);
                }
            })
            .catch(err => {
                const loader = document.getElementById('coach-loading');
                if (loader) loader.remove();
                appendChatMessage("bot", "My connection dropped while reviewing the game.", true);
                console.error("Summary error:", err);
            });
        }

        function checkGameOver() {
            if (game.game_over()) {
                let title = "Game Over";
                let subtitle = "";

                if (game.in_checkmate()) {
                    title = "Checkmate!";
                    subtitle = game.turn() === 'w' ? "Black Wins" : "White Wins";
                } else if (game.in_draw()) {
                    title = "Draw";
                    if (game.in_stalemate()) subtitle = "Stalemate";
                    else if (game.in_threefold_repetition()) subtitle = "Threefold Repetition";
                    else subtitle = "Insufficient Material";
                }

                $('#end-title').text(title);
                $('#end-subtitle').text(subtitle);
                $('#game-over-overlay').css('display', 'flex');

                const summaryBtn = document.querySelector('#game-over-overlay .primary');
                if (currentGameMode === 'play') {
                    summaryBtn.style.display = 'inline-block';
                } else {
                    summaryBtn.style.display = 'none';
                }
                
                $('#game-over-overlay').css('display', 'flex');
            }
        }

        function updateMoveList() {
            const moveListElement = document.getElementById('move-list');
            const history = game.history();
            moveListElement.innerHTML = ''; 

            for (let i = 0; i < history.length; i += 2) {
                const turnNum = Math.floor(i / 2) + 1;
                const whiteMove = history[i];
                const blackMove = history[i + 1] ? history[i + 1] : '';

                moveListElement.innerHTML += `
                    <div class="move-num">${turnNum}.</div>
                    <div class="move-val">${whiteMove}</div>
                    <div class="move-val">${blackMove}</div>
                `;
            }
            moveListElement.scrollTop = moveListElement.scrollHeight;
        }

        function onDrop(source, target) {
            clearArrows();

            if (source === target) return;
            if (currentGameMode === 'play' && game.turn() === 'b') return 'snapback';

            const piece = game.get(source);
            if (piece && piece.type === 'p' && (target[1] === '8' || target[1] === '1')) {
                pendingMove = { from: source, to: target };
                document.getElementById('promotion-overlay').style.display = 'flex';
                return; 
            }

            sendMoveToServer(source + target, source, target);
        }

        function sendMoveToServer(moveText, source, target) {
            clearArrows();

            fetch("/move", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ move: moveText })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    board.position(data.fen); 
                    
                    const promoChar = moveText.length === 5 ? moveText[4] : 'q';
                    game.move({ from: source, to: target, promotion: promoChar }); 
                    
                    updateMoveList();
                    updateCheckHighlight();
                    checkGameOver();

                    if (currentGameMode === 'analysis') {
                        updateEvalBar(data.evaluation);
                    }

                    if (currentGameMode === 'play') {
                        setTimeout(makeEngineMove, 250);
                    }
                } else {
                    board.position(game.fen()); 
                    return 'snapback'; 
                }
            });
        }

        function choosePromotion(pieceType) {
            if (!pendingMove) return;
            const moveText = pendingMove.from + pendingMove.to + pieceType;
            document.getElementById('promotion-overlay').style.display = 'none';
            sendMoveToServer(moveText, pendingMove.from, pendingMove.to);
            pendingMove = null;
        }

        function updateCheckHighlight() {
            $('.square-55d63').removeClass('highlight-check');
            if (game.in_check()) {
                const boardLayout = game.board();
                const turn = game.turn(); 

                for (let i = 0; i < 8; i++) {
                    for (let j = 0; j < 8; j++) {
                        const piece = boardLayout[i][j];
                        if (piece && piece.type === 'k' && piece.color === turn) {
                            const square = String.fromCharCode(97 + j) + (8 - i);
                            $('#myBoard .square-' + square).addClass('highlight-check');
                        }
                    }
                }
            }
        }

        function makeEngineMove() {
            const levelToSend = currentElo || 400;

            fetch("/engine_move", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ level: levelToSend })
            })
            .then(res => res.json())
            .then(data => {
                if (data.move) {
                    clearArrows();
                    
                    game.move(data.move, { sloppy: true });
                    board.position(data.fen);
                    
                    updateMoveList();
                    updateCheckHighlight();
                    checkGameOver();
                }
            })
            .catch(err => {
                console.error("Communication Breakdowns:", err);
            });
        }

        function updateEvalBar(evalValue) {
            const bar = document.getElementById('eval-bar');
            if (typeof evalValue === 'string' && evalValue.startsWith('M')) {
                bar.style.height = evalValue.includes('-') ? '0%' : '100%';
            } else {
                let percentage = 50 + (evalValue * 10);
                percentage = Math.max(5, Math.min(95, percentage)); 
                bar.style.height = percentage + '%';
            }
        }

        function resetGame() {
            clearArrows();

            fetch('/reset', { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                board.start();
                game.reset();
                updateMoveList();
                updateEvalBar(0);
                $('#game-over-overlay').hide(); 
                $('.square-55d63').removeClass('highlight-check'); 
            });
        }

        function clearArrows() {
            const svg = document.getElementById('arrow-svg');
            if (svg) svg.innerHTML = '';
        }

        function drawBestMoveArrow(fromSq, toSq) {
            const boardElement = document.getElementById('myBoard');
            const boardRect = boardElement.getBoundingClientRect();
            const squareSize = boardRect.width / 8;

            function getCoords(squareIndex) {
                const col = squareIndex % 8;
                const row = 7 - Math.floor(squareIndex / 8);
                return {
                    x: col * squareSize + squareSize / 2,
                    y: row * squareSize + squareSize / 2
                };
            }

            const start = getCoords(fromSq);
            const end = getCoords(toSq);

            let svg = document.getElementById('arrow-svg');
            if (!svg) {
                svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                svg.id = "arrow-svg";
                svg.setAttribute("style", "position:absolute; top:0; left:0; pointer-events:none; z-index: 10;");
                svg.setAttribute("width", boardRect.width);
                svg.setAttribute("height", boardRect.height);
                boardElement.appendChild(svg);
            }
            svg.innerHTML = '';

            // 1. Calculate the angle of the line
            const angle = Math.atan2(end.y - start.y, end.x - start.x);
            
            // 2. Shorten the line slightly so it doesn't poke out the front of the arrowhead
            const headLength = squareSize * 0.4; 
            const lineEndX = end.x - (headLength * 0.5) * Math.cos(angle);
            const lineEndY = end.y - (headLength * 0.5) * Math.sin(angle);

            // 3. Draw the Line (The Shaft)
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", start.x);
            line.setAttribute("y1", start.y);
            line.setAttribute("x2", lineEndX);
            line.setAttribute("y2", lineEndY);
            line.setAttribute("stroke", "rgba(50, 200, 50, 0.5)"); // Cleaner green
            line.setAttribute("stroke-width", squareSize * 0.15);  // Proportional thickness
            line.setAttribute("stroke-linecap", "round");
            svg.appendChild(line);

            // 4. Draw the Arrowhead (The Triangle)
            const head = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
            
            // Calculate 3 points of the triangle relative to 'end'
            const x1 = end.x;
            const y1 = end.y;
            const x2 = end.x - headLength * Math.cos(angle - Math.PI / 6);
            const y2 = end.y - headLength * Math.sin(angle - Math.PI / 6);
            const x3 = end.x - headLength * Math.cos(angle + Math.PI / 6);
            const y3 = end.y - headLength * Math.sin(angle + Math.PI / 6);

            head.setAttribute("points", `${x1},${y1} ${x2},${y2} ${x3},${y3}`);
            head.setAttribute("fill", "rgba(50, 200, 50, 0.5)");
            svg.appendChild(head);
        }

        // --- AI COACH CHAT LOGIC WITH TYPEWRITER EFFECT ---

        function appendChatMessage(sender, text, animate = false) {
            const chatHistory = document.getElementById('chat-history');
            const msgDiv = document.createElement('div');
            
            msgDiv.style.padding = '10px';
            msgDiv.style.borderRadius = '8px';
            msgDiv.style.marginBottom = '10px';
            msgDiv.style.fontSize = '0.9rem';
            msgDiv.style.lineHeight = '1.4';
            msgDiv.style.whiteSpace = 'pre-wrap'; // Keeps formatting neat

            const prefix = sender === 'bot' ? '<strong>🤖 Coach:</strong> ' : '<strong>👤 You:</strong> ';

            if (sender === 'bot') {
                msgDiv.style.background = '#f1f5f9'; 
                msgDiv.style.color = '#334155';

                // --- Retro Typewriter Effect Logic ---
                if (animate) {
                    msgDiv.innerHTML = prefix;
                    chatHistory.appendChild(msgDiv);
                    
                    let i = 0;
                    // Remove markdown bolding (**) for a cleaner chat interface
                    const cleanText = text.replace(/\*\*/g, ''); 
                    
                    function typeWriter() {
                        if (i < cleanText.length) {
                            msgDiv.innerHTML += cleanText.charAt(i);
                            i++;
                            chatHistory.scrollTop = chatHistory.scrollHeight; // Auto-scroll
                            setTimeout(typeWriter, 20); // 20ms delay per character
                        }
                    }
                    typeWriter();
                    return; // Exit here so it doesn't print instantly below
                }
            } else {
                msgDiv.style.background = '#e0f2fe'; 
                msgDiv.style.color = '#0369a1';
            }
            
            // Standard instant load (used for User messages)
            msgDiv.innerHTML = prefix + text;
            chatHistory.appendChild(msgDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight; 
        }

        // 1. Explain Move Button Action
        document.getElementById('explain-btn').addEventListener('click', function() {
            appendChatMessage("user", "Can you explain my last move?");
            
            const chatHistory = document.getElementById('chat-history');
            const loadingDiv = document.createElement('div');
            loadingDiv.id = "coach-loading"; 
            loadingDiv.className = "msg bot";
            loadingDiv.innerHTML = "<em>Analyzing your move...</em>";
            chatHistory.appendChild(loadingDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;

            fetch("/explain_move", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                // ✅ FIX: Send the board state and history to the backend
                body: JSON.stringify({ 
                    mode: currentGameMode,
                    fen: game.fen(),
                    history: game.history()
                })
            })
            .then(res => res.json())
            .then(data => {
                const loader = document.getElementById('coach-loading');
                if (loader) loader.remove();

                if (data.status === "success") {
                    appendChatMessage("bot", data.explanation, true); // true = Typewriter effect!
                } else {
                    appendChatMessage("bot", "Oops: " + data.message, true);
                }
            })
        });

        // 2. Best Move / Suggestion Action
        document.getElementById('suggest-btn').addEventListener('click', function() {
            appendChatMessage("user", "What is the best move here?");
            
            const chatHistory = document.getElementById('chat-history');
            const loadingDiv = document.createElement('div');
            loadingDiv.id = "coach-loading"; 
            loadingDiv.className = "msg bot";
            loadingDiv.innerHTML = "<em>Calculating the best line...</em>";
            chatHistory.appendChild(loadingDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;

            fetch("/best_move", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ fen: game.fen() }) // <--- Send the actual FEN!
            })
            .then(res => res.json())
            .then(data => {
                const loader = document.getElementById('coach-loading');
                if (loader) loader.remove();

                if (data.status === "success") {
                    drawBestMoveArrow(data.from_sq, data.to_sq);

                    const combinedMessage = `I recommend ${data.move}.\n\n${data.explanation}`;
                    appendChatMessage("bot", combinedMessage, true); // true = Typewriter effect!
                } else {
                    appendChatMessage("bot", "Oops: " + data.message, true);
                }
            })
            .catch(err => {
                const loader = document.getElementById('coach-loading');
                if (loader) loader.remove();
                appendChatMessage("bot", "My connection to the engine dropped.", true);
            });
        });
    </script>
</body>
</html>
