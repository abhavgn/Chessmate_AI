<!DOCTYPE html>
<html lang="en">
<head>
    <title>Chessmate AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>
<body>
    <div class="main-container">
        <div id="board-side">
            <h2 style="color: white; text-align: center; margin-top: 0; font-family: sans-serif;">Chessmate AI</h2>
            
            <div class="board-eval-wrapper">
                <div id="eval-bar-container">
                    <div id="eval-bar"></div>
                </div>
                <div id="myBoard"></div>
            </div>
            
            <div class="board-actions">
                <button class="action-btn primary" id="explain-btn">Explain Move</button>
                <button class="action-btn secondary" id="suggest-btn">Best Move?</button>
                <button class="action-btn danger" onclick="resetGame()">Reset Game</button>
            </div>
        </div>

        <div id="sidebar">
            <div class="mode-toggle">
                <button class="mode-btn active" onclick="setMode('analysis', this)">Analysis</button>
                <button class="mode-btn" onclick="setMode('play', this)">Play AI</button>
            </div>

            <div id="elo-panel" style="display: none;">
                <p style="color: #64748b; font-size: 0.8rem; margin-bottom: 8px; font-weight: bold;">SELECT DIFFICULTY:</p>
                <div class="elo-grid">
                    <button class="elo-btn active" onclick="setElo(200, this)">200</button>
                    <button class="elo-btn" onclick="setElo(400, this)">400</button>
                    <button class="elo-btn" onclick="setElo(800, this)">800</button>
                    <button class="elo-btn" onclick="setElo(1200, this)">1200</button>
                    <button class="elo-btn" onclick="setElo(1600, this)">1600</button>
                    <button class="elo-btn" onclick="setElo(2000, this)">2000</button>
                    <button class="elo-btn" onclick="setElo(2400, this)">2400</button>
                    <button class="elo-btn" onclick="setElo(2800, this)">2800+</button>
                </div>
            </div>

            <div class="chat-wrapper">
                <div class="chat-header">🤖 AI Coach Chat</div>
                <div id="chat-history">
                    <div class="msg bot">Hello James! Ready to analyze?</div>
                </div>
                <div class="chat-input-area">
                    <input type="text" placeholder="Ask coach anything...">
                    <button class="send-btn">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        var board = null;
        var game = new Chess();
        var currentGameMode = 'analysis'; // Start in analysis mode by default

        let currentElo = 400; // Default Elo

        function setMode(mode, element) {
            currentGameMode = mode;
            
            // Toggle Active Class
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');

            const evalContainer = document.getElementById('eval-bar-container');
            const eloPanel = document.getElementById('elo-panel');

            if (mode === 'play') {
                evalContainer.style.display = 'none'; // Completely removes the bar
                eloPanel.style.display = 'block';    // Shows Elo buttons
            } else {
                evalContainer.style.display = 'block'; // Brings it back for analysis
                eloPanel.style.display = 'none';
            }
        }

        function setElo(elo, element) {
            currentElo = elo; // Update our tracker
            
            // UI Visual Toggle
            document.querySelectorAll('.elo-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            
            console.log("Difficulty set to:", currentElo);
        }

        function onDrop(source, target) {
            let moveText = source + target;

            // 1. Send your move to the server
            fetch("/move", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ move: moveText })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    board.position(data.fen); // Update the board visually
                    
                    // 2. Only update eval bar if in ANALYSIS mode
                    if (currentGameMode === 'analysis') {
                        updateEvalBar(data.evaluation);
                    }

                    // 3. TRIGGER THE BOT if in PLAY mode
                    if (currentGameMode === 'play') {
                        // We add a tiny delay so the board updates before the bot thinks
                        setTimeout(makeEngineMove, 250);
                    }
                } else {
                    return 'snapback'; // Invalid move
                }
            });
        }

        function makeEngineMove() {
            // If for some reason currentElo is missing, force it to 400
            const levelToSend = currentElo || 400;

            fetch("/engine_move", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ level: levelToSend })
            })
            .then(res => res.json())
            .then(data => {
                if (data.move) {
                    game.move(data.move, { sloppy: true });
                    board.position(data.fen);
                    
                    // Highlight the bot's move (Optional but recommended)
                    console.log("Bot played: " + data.move);
                }
            })
            .catch(err => {
                console.error("Communication Breakdowns:", err);
                alert("The engine is taking too long to think. Check your Python terminal!");
            });
        }

        function updateEvalBar(evalValue) {
            const bar = document.getElementById('eval-bar');
            if (typeof evalValue === 'string' && evalValue.startsWith('M')) {
                bar.style.height = evalValue.includes('-') ? '0%' : '100%';
            } else {
                // Calculation for the bar height based on centipawns
                let percentage = 50 + (evalValue * 10);
                percentage = Math.max(5, Math.min(95, percentage)); 
                bar.style.height = percentage + '%';
            }
        }

        function resetGame() {
            fetch('/reset', { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                board.start();
                game.reset();
                updateEvalBar(0);
            });
        }

        var config = {
            draggable: true,
            position: 'start',
            onDrop: onDrop,
            pieceTheme: function (piece) {
                var color = (piece.search(/w/) !== -1) ? 'white' : 'black';
                var type = '';
                if (piece.search(/P/) !== -1) type = 'pawn';
                if (piece.search(/R/) !== -1) type = 'rook';
                if (piece.search(/N/) !== -1) type = 'knight';
                if (piece.search(/B/) !== -1) type = 'bishop';
                if (piece.search(/Q/) !== -1) type = 'queen';
                if (piece.search(/K/) !== -1) type = 'king';
                return '/static/css/img/' + color + '-' + type + '.png';
            }
        };
        board = Chessboard('myBoard', config);
        
        // --- ADD THE AUTO-INIT FIX HERE ---
        document.addEventListener("DOMContentLoaded", function() {
            // 1. Ensure 400 Elo is the logic default
            currentElo = 200; 

            // 2. Find the 400 button and make it look active visually
            // This looks for the first button in the elo-grid
            const defaultEloBtn = document.querySelector('.elo-btn'); 
            if (defaultEloBtn) {
                defaultEloBtn.classList.add('active');
            }
            
            console.log("System Initialized: Bot set to 400 Elo");
        });

    </script>
</body>
</html>
