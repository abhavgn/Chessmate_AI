<!DOCTYPE html>
<html lang="en">
<head>
    <title>Chessmate AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>
<body>
    <div class="container">
        <div id="eval-bar-container">
            <div id="eval-bar"></div>
        </div>

        <div id="board-container">
            <div class="mode-settings" style="margin-bottom: 10px;">
                <select id="game-mode" onchange="currentGameMode = this.value">
                    <option value="analysis">Analysis Board</option>
                    <option value="play">Play Against Engine</option>
                </select>

                <select id="skill-level">
                    <option value="400">400 Elo (Novice)</option>
                    <option value="800">800 Elo (Beginner)</option>
                    <option value="1200">1200 Elo (Intermediate)</option>
                    <option value="1600">1600 Elo (Advanced)</option>
                    <option value="2000">2000 Elo (Expert)</option>
                    <option value="2400">2400 Elo (Master)</option>
                    <option value="2800">2800+ Elo (Super GM)</option>
                </select>
            </div>
            <h1>Chessmate AI</h1>
            <div id="myBoard" style="width: 400px"></div>
            <div class="controls">
                <button id="explain-btn">Explain Last Move</button>
                <button id="suggest-btn">Best Move?</button>
                <button id="reset-btn" onclick="resetGame()">Reset Game</button>
            </div>
        </div>

        <div id="chat-sidebar">
            <h3>AI Coach Chat</h3>
            <div id="chat-history">
                <p><strong>Coach:</strong> Hello James! Ready to analyze?</p>
            </div>
        </div>
    </div>

    <script>
        var board = null;
        var game = new Chess();
        var currentGameMode = 'analysis'; // Start in analysis mode by default

        function onDrop(source, target) {
            if (source === target) return 'snapback';
            
            // Check if move is legal in chess.js first
            var move = game.move({
                from: source,
                to: target,
                promotion: 'q'
            });

            if (move === null) return 'snapback';

            fetch('/move', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({move: source + target})
            })
            .then(response => response.json())
            .then(data => {
                // Use data.evaluation as per your app.py return key
                updateEvalBar(data.evaluation);
                
                if (currentGameMode === 'play') {
                    setTimeout(makeEngineMove, 500);
                }
            });
        }

        function makeEngineMove() {
            // Get the value (400, 800, etc.) from the dropdown
            const eloValue = document.getElementById('skill-level').value;

            fetch('/engine_move', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ 
                    fen: game.fen(), 
                    level: parseInt(eloValue) // Sending the Elo number as "level"
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.move) {
                    game.move(data.move, { sloppy: true }); 
                    board.position(game.fen()); 
                    updateEvalBar(data.evaluation);
                }
            });
        }

        function updateEvalBar(evalValue) {
            const bar = document.getElementById('eval-bar');
            if (typeof evalValue === 'string' && evalValue.startsWith('M')) {
                bar.style.height = evalValue.includes('-') ? '0%' : '100%';
            } else {
                // Calculation for the bar height based on centipawns
                let percentage = 50 + (evalValue * 10);
                percentage = Math.max(5, Math.min(95, percentage)); 
                bar.style.height = percentage + '%';
            }
        }

        function resetGame() {
            fetch('/reset', { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                board.start();
                game.reset();
                updateEvalBar(0);
            });
        }

        var config = {
            draggable: true,
            position: 'start',
            onDrop: onDrop,
            pieceTheme: function (piece) {
                var color = (piece.search(/w/) !== -1) ? 'white' : 'black';
                var type = '';
                if (piece.search(/P/) !== -1) type = 'pawn';
                if (piece.search(/R/) !== -1) type = 'rook';
                if (piece.search(/N/) !== -1) type = 'knight';
                if (piece.search(/B/) !== -1) type = 'bishop';
                if (piece.search(/Q/) !== -1) type = 'queen';
                if (piece.search(/K/) !== -1) type = 'king';
                return '/static/css/img/' + color + '-' + type + '.png';
            }
        };
        board = Chessboard('myBoard', config);
    </script>
</body>
</html>
