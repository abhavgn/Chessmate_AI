<!DOCTYPE html>
<html lang="en">
<head>
    <title>Chessmate AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>
<body>
    <div class="container">
        <div id="eval-bar-container">
            <div id="eval-bar"></div>
        </div>

        <div id="board-container">
            <h1>Chessmate AI</h1>
            <div id="myBoard" style="width: 400px"></div>
            <div class="controls">
                <button id="explain-btn">Explain Last Move</button>
                <button id="suggest-btn">Best Move?</button>
                <button id="reset-btn" onclick="resetGame()">Reset Game</button>
            </div>
        </div>

        <div id="chat-sidebar">
            <h3>AI Coach Chat</h3>
            <div id="chat-history">
                <p><strong>Coach:</strong> Hello James! Ready to analyze?</p>
            </div>
        </div>
    </div>

    <script>
        var board = null;
        var game = new Chess();

        function onDrop(source, target) {
            if (source === target) return 'snapback';
            var move = source + target;

            fetch('/move', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({move: move})
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    board.position(data.fen);
                    game.load(data.fen); // Keeps the frontend move turn in sync
                    updateEvalBar(data.evaluation);
                } else {
                    board.position(game.fen()); 
                    alert("Invalid: " + data.message);
                }
            });
        }

        function updateEvalBar(evalValue) {
            const bar = document.getElementById('eval-bar');
            if (typeof evalValue === 'string' && evalValue.startsWith('M')) {
                bar.style.height = evalValue.includes('-') ? '0%' : '100%';
            } else {
                // Calculation for the bar height based on centipawns
                let percentage = 50 + (evalValue * 10);
                percentage = Math.max(5, Math.min(95, percentage)); 
                bar.style.height = percentage + '%';
            }
        }

        function resetGame() {
            fetch('/reset', { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                board.start();
                game.reset();
                updateEvalBar(0);
            });
        }

        var config = {
            draggable: true,
            position: 'start',
            onDrop: onDrop,
            pieceTheme: function (piece) {
                var color = (piece.search(/w/) !== -1) ? 'white' : 'black';
                var type = '';
                if (piece.search(/P/) !== -1) type = 'pawn';
                if (piece.search(/R/) !== -1) type = 'rook';
                if (piece.search(/N/) !== -1) type = 'knight';
                if (piece.search(/B/) !== -1) type = 'bishop';
                if (piece.search(/Q/) !== -1) type = 'queen';
                if (piece.search(/K/) !== -1) type = 'king';
                return '/static/css/img/' + color + '-' + type + '.png';
            }
        };
        board = Chessboard('myBoard', config);
    </script>
</body>
</html>
