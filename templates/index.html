<!DOCTYPE html>
<html lang="en">
<head>
    <title>Chessmate AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>
<body>
    <div class="container">
        <div id="eval-bar"></div>

        <div id="board-container">
            <h1>Chessmate AI</h1>
            <div id="myBoard" style="width: 400px"></div>
            <div class="controls">
                <button id="explain-btn">Explain Last Move</button>
                <button id="suggest-btn">Best Move?</button>
            </div>
        </div>

        <div id="chat-sidebar">
            <h3>AI Coach Chat</h3>
            <div id="chat-history">
                <p><strong>Coach:</strong> Hello James! Ready to analyze?</p>
            </div>
        </div>
    </div>
    <script>
        var board = null;
        var game = new Chess(); // This is a helper library for the frontend

        function onDrop(source, target) {
            var move = source + target; // e.g., "e2e4"

            // Send the move to your Flask /move route
            fetch('/move', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({move: move})
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    console.log("Move successful! New FEN: " + data.fen);
                } else {
                    // If move is illegal, snap the piece back
                    board.position(data.fen || 'start');
                    alert("Invalid move!");
                }
            });
        }

        var config = {
            draggable: true,
            position: 'start',
            onDrop: onDrop
        };
        board = Chessboard('myBoard', config);
    </script>
</body>
</html>
