name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Create .env for bundle
        run: echo OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} > .env

      - name: Build EXE with PyInstaller
        run: pyinstaller --noconfirm --onedir --windowed --name "ChessmateAI" --add-data "templates;templates" --add-data "static;static" --add-data "engines;engines" --add-data ".env;." --hidden-import flask --hidden-import chess --hidden-import chess.engine --hidden-import openai --hidden-import dotenv app.py

      - name: Create launcher batch file
        shell: cmd
        run: |
          echo @echo off > dist\ChessmateAI\START.bat
          echo echo Starting Chessmate AI... >> dist\ChessmateAI\START.bat
          echo start http://localhost:5000 >> dist\ChessmateAI\START.bat
          echo ChessmateAI.exe >> dist\ChessmateAI\START.bat

      - name: Zip the output
        run: Compress-Archive -Path dist\ChessmateAI\* -DestinationPath ChessmateAI-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChessmateAI-Windows
          path: ChessmateAI-Windows.zip
          retention-days: 30