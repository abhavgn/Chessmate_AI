name: Build-Windows-EXE
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: |
          pip install flask python-dotenv python-chess openai pyinstaller
          pyinstaller --noconfirm --onefile --windowed --add-data "static;static" --add-data "templates;templates" --add-data "engines;engines" --add-data ".env;." --collect-all "chess" app.py
      - uses: actions/upload-artifact@v4
        with:
          name: Chessmate-Windows-Binary
          path: dist/*.exe